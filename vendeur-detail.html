<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafePay RDC - Validation Livraison</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        emeraldVendeur: '#10B981',
                        safepayDark: '#1E1B4B',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-100 flex justify-center items-center min-h-screen font-sans">

    <div class="w-full max-w-md bg-white min-h-[840px] shadow-2xl rounded-[40px] overflow-hidden border-[8px] border-slate-800 flex flex-col relative">
        
        <div class="px-6 pt-3 pb-2 flex justify-between items-center text-xs font-bold text-slate-700 bg-white">
            <span>14:46</span>
            <div class="flex gap-1 items-center"><span>📶</span><span>🔋</span></div>
        </div>

        <div class="px-6 py-4 flex items-center border-b border-slate-50">
            <a href="vendeur.html" class="text-xl text-slate-800 font-bold mr-4">←</a>
            <h1 class="text-lg font-extrabold text-slate-900">Validation Livraison</h1>
        </div>

        <div class="p-6 flex-1 overflow-y-auto pb-32">
            
            <div class="bg-emerald-50 border border-emerald-100 rounded-2xl p-4 text-center mb-6">
                <span class="text-xs font-bold text-emerald-700 uppercase tracking-wider block mb-1">Fonds Séquestrés</span>
                <h2 id="montant-vendeur" class="text-3xl font-black text-slate-900">-- $</h2>
                <p class="text-xs text-slate-500 mt-1" id="statut-actuel">Statut : Chargement...</p>
            </div>

            <div class="space-y-4 bg-slate-50 p-4 rounded-2xl border border-slate-100 text-sm">
                <div class="flex justify-between"><span class="text-slate-400">Commande :</span><span id="cmd-id" class="font-mono font-bold text-slate-800">#---</span></div>
                <div class="flex justify-between"><span class="text-slate-400">Article :</span><span id="txt-produit" class="font-semibold text-slate-800">--</span></div>
                <div class="flex justify-between"><span class="text-slate-400">Acheteur :</span><span id="txt-acheteur" class="font-semibold text-slate-800">--</span></div>
                <div class="flex justify-between"><span class="text-slate-400">Téléphone :</span><span id="txt-phone" class="font-semibold text-slate-800">--</span></div>
            </div>

            <div id="otp-area" class="mt-8">
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Introduire le Code OTP fourni par l'acheteur</label>
                <input type="text" id="otp-input" maxlength="4" placeholder="0000" class="w-full text-center tracking-widest text-xl font-black px-4 py-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-emeraldVendeur font-mono">
                <p class="text-[11px] text-slate-400 mt-1.5 text-center">Ce code confirme la remise en main propre du colis conforme.</p>
            </div>

            <div id="status-update-msg" class="mt-6 text-center text-sm font-semibold hidden"></div>
        </div>

        <div class="absolute bottom-0 left-0 right-0 p-6 bg-white border-t border-slate-50">
            <button onclick="validerCodeOtp()" id="btn-valider" class="w-full bg-emeraldVendeur hover:bg-emerald-600 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg shadow-emerald-100 transition-all text-sm">
                Confirmer la livraison & encaisser
            </button>
        </div>

    </div>

    <script>
        const API_URL = "https://safepay-rdc-1.onrender.com/api";
        
        // Extraction intelligente de l'ID depuis l'URL ou récupération automatique dans le LocalStorage
        const urlParams = new URLSearchParams(window.location.search);
        let transactionId = urlParams.get('id') || localStorage.getItem("currentTransactionId");

        // Charger les informations de la transaction en temps réel
        async function chargerDetailsCommande() {
            try {
                const response = await fetch(`${API_URL}/transactions`);
                const transactions = await response.json();

                // Si aucun ID n'est trouvé, on prend la dernière transaction du tableau pour le test
                let tx = null;
                if (transactionId) {
                    tx = transactions.find(t => t._id === transactionId || t.id === transactionId);
                } else if (transactions.length > 0) {
                    tx = transactions[transactions.length - 1]; 
                    transactionId = tx._id || tx.id;
                }

                if (tx) {
                    document.getElementById('montant-vendeur').innerText = `${tx.montant} ${tx.devise || 'USD'}`;
                    document.getElementById('cmd-id').innerText = `#${tx.numeroCommande || 'CMD1258'}`;
                    document.getElementById('txt-produit').innerText = tx.produit || 'Casque Bluetooth';
                    document.getElementById('txt-acheteur').innerText = tx.acheteur || 'Jean';
                    document.getElementById('txt-phone').innerText = tx.telephoneClient || '-';
                    
                    const statutLabel = document.getElementById('statut-actuel');
                    const btn = document.getElementById('btn-valider');
                    
                    if (tx.statut.toLowerCase() === 'validé' || tx.statut.toLowerCase() === 'ok') {
                        statutLabel.innerText = "Statut : 🎉 Payé & Libéré";
                        statutLabel.className = "text-xs text-emerald-600 font-bold mt-1";
                        
                        document.getElementById('otp-area').classList.add('hidden');
                        btn.className = "w-full bg-slate-100 text-slate-400 font-bold py-3.5 px-4 rounded-xl text-sm cursor-not-allowed";
                        btn.innerText = "Fonds déjà versés";
                        btn.disabled = true;
                    } else {
                        statutLabel.innerText = `Statut : 🔒 En séquestre (${tx.statut})`;
                        statutLabel.className = "text-xs text-amber-600 font-bold mt-1";
                    }
                }
            } catch (error) {
                console.error("Erreur de chargement du panneau vendeur :", error);
            }
        }

        // Valider l'OTP contre l'API backend
        async function validerCodeOtp() {
            const codeOtp = document.getElementById('otp-input').value;
            const btn = document.getElementById('btn-valider');
            const msg = document.getElementById('status-update-msg');

            if (!codeOtp || codeOtp.length < 4) {
                alert("Veuillez entrer le code OTP complet à 4 chiffres.");
                return;
            }

            btn.disabled = true;
            msg.classList.remove('hidden');
            msg.className = "mt-4 text-center text-sm font-semibold text-amber-600";
            msg.innerText = "⚡ Vérification de la clé de déblocage...";

            try {
                const reponse = await fetch(`${API_URL}/transactions/debloquer`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        transactionId: transactionId,
                        otp: codeOtp
                    })
                });

                const resultat = await reponse.json();

                if (resultat.success) {
                    msg.className = "mt-4 text-center text-sm font-semibold text-emerald-600";
                    msg.innerHTML = "🎉 Succès ! Le paiement a été libéré sur votre compte.";
                    
                    // Rechargement immédiat de l'interface
                    chargerDetailsCommande();
                } else {
                    alert("⚠️ Code incorrect : " + resultat.message);
                    btn.disabled = false;
                    msg.classList.add('hidden');
                }
            } catch (error) {
                alert("Erreur réseau lors de la validation.");
                btn.disabled = false;
                msg.classList.add('hidden');
            }
        }

        // Init au chargement
        document.addEventListener("DOMContentLoaded", () => {
            chargerDetailsCommande();
            // Polling automatique pour voir si l'acheteur valide de son côté
            setInterval(chargerDetailsCommande, 5000);
        });
    </script>
</body>
                    </html>
