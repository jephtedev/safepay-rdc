<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafePay RDC - Validation Livraison</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        emeraldVendeur: '#10B981',
                        safepayDark: '#1E1B4B',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-100 flex justify-center items-center min-h-screen font-sans">

    <div class="w-full max-w-md bg-white min-h-[840px] shadow-2xl rounded-[40px] overflow-hidden border-[8px] border-slate-800 flex flex-col relative">
        
        <div class="px-6 pt-3 pb-2 flex justify-between items-center text-xs font-bold text-slate-700 bg-white">
            <span>14:46</span>
            <div class="flex gap-1 items-center"><span>📶</span><span>🔋</span></div>
        </div>

        <div class="px-6 py-4 flex items-center border-b border-slate-50">
            <a href="vendeur.html" class="text-xl text-slate-800 font-bold mr-4">←</a>
            <h1 class="text-lg font-extrabold text-slate-900">Validation de livraison</h1>
        </div>

        <div class="p-6 flex-1 overflow-y-auto pb-24 text-center">
            
            <div class="bg-slate-50 rounded-2xl p-4 border border-slate-100 text-left mb-6">
                <div class="flex items-center">
                    <div id="produit-icone" class="w-12 h-12 bg-white rounded-xl flex items-center justify-center text-xl shadow-sm">📦</div>
                    <div class="ml-3 flex-1">
                        <span id="num-commande" class="text-[10px] font-mono text-slate-400">CHARGEMENT...</span>
                        <h3 id="nom-produit" class="font-bold text-slate-800 text-sm">-</h3>
                        <p id="nom-acheteur" class="text-xs text-slate-400">Acheteur : -</p>
                    </div>
                    <span id="montant-produit" class="font-black text-slate-900 text-base">- $</span>
                </div>
            </div>

            <div id="statut-container" class="mb-4 hidden">
                <span id="statut-badge" class="px-3 py-1 rounded-full text-xs font-bold"></span>
            </div>

            <p class="text-sm font-medium text-slate-600 px-4">
                Demandez à l'acheteur son code secret ou scannez son application pour valider la remise du colis et recevoir vos fonds.
            </p>

            <div class="my-8 flex flex-col items-center justify-center">
                <div class="p-4 bg-white border-2 border-slate-100 rounded-3xl shadow-md inline-block">
                    <img id="qr-code-image" src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=waiting" alt="QR Code Validation" class="w-44 h-44">
                </div>
                <span class="text-[11px] font-bold text-slate-400 mt-3 uppercase tracking-wider">Scanner pour valider</span>
            </div>

            <div class="flex items-center my-6">
                <div class="flex-1 h-px bg-slate-100"></div>
                <span class="px-3 text-xs font-bold text-slate-400 uppercase">OU</span>
                <div class="flex-1 h-px bg-slate-100"></div>
            </div>

            <div class="mt-4">
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-wide mb-2">Code de validation manuel</label>
                
                <input type="text" id="otp-input" maxlength="4" pattern="\d*" inputmode="numeric" class="absolute opacity-0 w-1 h-1 z-[-1]">
                
                <div id="otp-box-container" class="flex justify-center gap-2 cursor-pointer">
                    <span id="digit-0" class="w-12 h-14 bg-slate-50 border border-slate-200 rounded-xl flex items-center justify-center font-black text-xl text-slate-800 transition-all duration-200">-</span>
                    <span id="digit-1" class="w-12 h-14 bg-slate-50 border border-slate-200 rounded-xl flex items-center justify-center font-black text-xl text-slate-800 transition-all duration-200">-</span>
                    <span id="digit-2" class="w-12 h-14 bg-slate-50 border border-slate-200 rounded-xl flex items-center justify-center font-black text-xl text-slate-800 transition-all duration-200">-</span>
                    <span id="digit-3" class="w-12 h-14 bg-slate-50 border border-slate-200 rounded-xl flex items-center justify-center font-black text-xl text-slate-800 transition-all duration-200">-</span>
                </div>
                <p id="msg-erreur" class="text-xs text-red-500 font-semibold mt-3 hidden"></p>
            </div>

        </div>

        <div class="absolute bottom-0 left-0 right-0 p-4 bg-slate-50 border-t border-slate-100 text-center text-[11px] font-medium text-slate-400 flex items-center justify-center gap-1">
            🔒 Sécurisé de bout en bout par SafePay RDC séquestre.
        </div>

    </div>

    <script>
        // CORRECTION DE L'URL : Pointage sur ton serveur de production sur Render
        const API_URL = "https://safepay-rdc-1.onrender.com/api";
        
        // Récupère la transaction sélectionnée (ID Mongo ou simulation) ou prend la valeur par défaut
        let transactionId = localStorage.getItem("currentTransactionId") || "664c1234e5678901234567f2"; 

        const otpInput = document.getElementById('otp-input');
        const otpBoxes = [
            document.getElementById('digit-0'),
            document.getElementById('digit-1'),
            document.getElementById('digit-2'),
            document.getElementById('digit-3')
        ];

        // 1. Récupérer les informations de la transaction depuis l'API Render
        async function chargerDetailsTransaction() {
            try {
                const response = await fetch(`${API_URL}/transactions`);
                const transactions = await response.json(); // Reçoit directement le tableau

                // Recherche la transaction par ID MongoDB (_id) ou ID simulé (id)
                const tx = transactions.find(t => t._id === transactionId || t.id === transactionId);

                if (tx) {
                    // Injection des données dynamiques
                    document.getElementById("num-commande").innerText = `COMMANDE #${tx.numeroCommande || '1258'}`;
                    document.getElementById("nom-produit").innerText = tx.produit;
                    document.getElementById("nom-acheteur").innerText = `Acheteur : ${tx.acheteur || 'Jean'}`;
                    document.getElementById("montant-produit").innerText = `${tx.montant} $`;

                    // Gestion des icônes
                    if (tx.produit.toLowerCase().includes("casque")) {
                        document.getElementById("produit-icone").innerText = "🎧";
                    } else if (tx.produit.toLowerCase().includes("montre")) {
                        document.getElementById("produit-icone").innerText = "⌚";
                    }

                    // Génération dynamique du QR Code de validation
                    const targetId = tx._id || tx.id;
                    document.getElementById("qr-code-image").src = `https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=safepay-${targetId}-valide`;

                    // Gestion des états des badges de statut
                    const badgeContainer = document.getElementById("statut-container");
                    const badge = document.getElementById("statut-badge");
                    
                    if (tx.statut && tx.statut.toLowerCase() !== "en attente") {
                        badgeContainer.classList.remove("hidden");
                        
                        if (tx.statut.toLowerCase() === "validé" || tx.statut.toLowerCase() === "ok") {
                            badge.innerText = "LIVRAISON VALIDÉE (FONDS LIBÉRÉS)";
                            badge.className = "px-3 py-1 rounded-full text-xs font-bold bg-green-100 text-green-700";
                        } else {
                            badge.innerText = "TRANSACTION EN LITIGE";
                            badge.className = "px-3 py-1 rounded-full text-xs font-bold bg-red-100 text-red-700";
                        }
                        
                        otpInput.disabled = true;
                    }
                } else {
                    document.getElementById("num-commande").innerText = "TRANSACTION INTROUVABLE";
                }
            } catch (error) {
                console.error("Erreur de chargement des détails :", error);
                document.getElementById("num-commande").innerText = "ERREUR DE SYNCHRONISATION NETWORK";
            }
        }

        // 2. Gestion de l'interaction visuelle du pavé de validation manuel
        document.getElementById('otp-box-container').addEventListener('click', () => {
            if (!otpInput.disabled) otpInput.focus();
        });

        otpInput.addEventListener('input', (e) => {
            const valeur = e.target.value;
            document.getElementById("msg-erreur").classList.add("hidden");

            for (let i = 0; i < 4; i++) {
                if (valeur[i]) {
                    otpBoxes[i].innerText = valeur[i];
                    otpBoxes[i].classList.add("border-emeraldVendeur", "bg-emerald-50");
                } else {
                    otpBoxes[i].innerText = "-";
                    otpBoxes[i].classList.remove("border-emeraldVendeur", "bg-emerald-50");
                }
            }

            if (valeur.length === 4) {
                validerLivraison(valeur);
            }
        });

        // 3. Envoyer la demande de déblocage au serveur Node.js (Render)
        async function validerLivraison(codeOtp) {
            try {
                const response = await fetch(`${API_URL}/transactions/debloquer`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        transactionId: transactionId,
                        otp: codeOtp
                    })
                });

                const resultat = await response.json();

                if (resultat.success) {
                    alert("🔓 " + resultat.message);
                    window.location.href = "vendeur.html"; // Redirection automatique vers le dashboard mis à jour
                } else {
                    const msgErreur = document.getElementById("msg-erreur");
                    msgErreur.innerText = resultat.message;
                    msgErreur.classList.remove("hidden");
                    
                    // Réinitialisation de la saisie
                    otpInput.value = "";
                    otpBoxes.forEach(box => {
                        box.innerText = "-";
                        box.classList.remove("border-emeraldVendeur", "bg-emerald-50");
                    });
                }
            } catch (error) {
                console.error("Erreur lors de la validation :", error);
                alert("Erreur de communication avec le serveur principal.");
            }
        }

        // Démarrage de la synchronisation au chargement de l'écran
        document.addEventListener("DOMContentLoaded", chargerDetailsTransaction);
    </script>
</body>
    </html>
