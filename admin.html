<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafePay RDC - Dashboard Administrateur</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        adminDark: '#0F111A',
                        adminSidebar: '#161926',
                        adminPurple: '#6366F1',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 font-sans flex min-h-screen text-slate-800">

    <!-- Sidebar -->
    <div class="w-64 bg-adminSidebar text-slate-400 flex flex-col border-r border-slate-800 shrink-0">
        <div class="p-6 flex items-center gap-3 border-b border-slate-800 bg-adminDark">
            <div class="w-8 h-8 bg-adminPurple rounded-xl flex items-center justify-center text-white font-black text-lg shadow-md shadow-indigo-500/30">🔒</div>
            <div>
                <h1 class="font-black text-white text-sm tracking-wide">SafePay RDC</h1>
                <p class="text-[10px] text-slate-500 font-bold uppercase tracking-wider">Console Admin</p>
            </div>
        </div>

        <nav class="flex-1 p-4 space-y-1.5 text-sm font-semibold">
            <a href="#" class="flex items-center gap-3 px-4 py-3 text-white bg-adminPurple/10 border-l-4 border-adminPurple rounded-r-xl transition-all">📊 Tableau de bord</a>
            <a href="#" class="flex items-center gap-3 px-4 py-3 hover:text-white hover:bg-slate-800/40 rounded-xl transition-all">🔄 Transactions</a>
            <a href="#" class="flex items-center gap-3 px-4 py-3 hover:text-white hover:bg-slate-800/40 rounded-xl transition-all">⚠️ Litiges <span class="ml-auto bg-red-500 text-white text-[10px] px-2 py-0.5 rounded-full font-black">2</span></a>
        </nav>

        <div class="p-4 border-t border-slate-800 text-xs font-medium text-slate-500 flex items-center gap-3">
            <div class="w-9 h-9 rounded-full bg-purple-600 flex items-center justify-center text-white font-bold">JM</div>
            <div>
                <p class="text-white font-bold">Jephté MANWANA</p>
                <p class="text-[10px] text-purple-400">Admin Système Principal</p>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col min-w-0 overflow-y-auto">
        <header class="bg-white border-b border-slate-100 h-16 flex items-center justify-between px-8 shrink-0">
            <h2 class="text-lg font-black text-slate-900">Vue d'ensemble du réseau</h2>
        </header>

        <main class="p-8 space-y-8 flex-1" id="admin-main">
            <div id="admin-table-body">
                <!-- Les transactions seront injectées ici -->
            </div>
        </main>
    </div>

    <script>
        async function chargerTransactionsAdmin() {
            try {
                const response = await fetch('https://safepay-rdc-1.onrender.com/api/transactions');
                const transactions = await response.json();
                
                // Exemple de logique d'affichage simple
                const container = document.getElementById('admin-table-body');
                container.innerHTML = `<pre class="text-xs text-slate-400">${JSON.stringify(transactions, null, 2)}</pre>`;
            } catch (error) { 
                console.error("Erreur de connexion aux données:", error); 
            }
        }

        chargerTransactionsAdmin();
        setInterval(chargerTransactionsAdmin, 5000);
    </script>
</body>
    </html>
