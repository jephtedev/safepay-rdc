<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafePay RDC - Console Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* S'assure que le contenu remplit bien l'espace de l'iframe */
        body { background: white; color: #1e293b; height: 100vh; overflow-y: auto; }
    </style>
</head>
<body class="p-6">

    <div class="flex justify-between items-center mb-6 border-b pb-4">
        <h2 class="text-xl font-black text-slate-900">Vue d'ensemble du réseau</h2>
        <button onclick="chargerTransactionsAdmin()" class="text-xs bg-indigo-600 text-white px-3 py-1 rounded-lg font-bold">
            🔄 Rafraîchir
        </button>
    </div>

    <div class="grid grid-cols-2 gap-4 mb-8">
        <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100">
            <p class="text-[10px] uppercase font-bold text-slate-400">Transactions</p>
            <p id="stat-count" class="text-2xl font-black">128</p>
        </div>
        <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100">
            <p class="text-[10px] uppercase font-bold text-slate-400">Séquestre</p>
            <p id="stat-escrow" class="text-2xl font-black text-indigo-600">15 250 $</p>
        </div>
    </div>

    <div class="overflow-x-auto">
        <table class="w-full text-left text-[11px]">
            <thead>
                <tr class="text-slate-400 uppercase">
                    <th class="pb-2">ID</th>
                    <th class="pb-2">Client</th>
                    <th class="pb-2">Montant</th>
                    <th class="pb-2">Statut</th>
                </tr>
            </thead>
            <tbody id="admin-table-body" class="divide-y divide-slate-100">
                </tbody>
        </table>
    </div>

    <script>
        async function chargerTransactionsAdmin() {
            try {
                const response = await fetch('https://safepay-rdc-1.onrender.com/api/transactions');
                const transactions = await response.json();
                const tableBody = document.getElementById('admin-table-body');
                tableBody.innerHTML = ''; 

                transactions.slice(0, 5).forEach(tx => {
                    const row = `
                        <tr class="hover:bg-slate-50">
                            <td class="py-3 font-bold">#${tx._id ? tx._id.substring(tx._id.length - 5).toUpperCase() : 'TRX'}</td>
                            <td class="py-3">${tx.acheteur || 'Client'}</td>
                            <td class="py-3 font-bold">${tx.montant || 0} $</td>
                            <td class="py-3"><span class="bg-green-100 text-green-600 px-2 py-0.5 rounded-full">${tx.statut || 'OK'}</span></td>
                        </tr>
                    `;
                    tableBody.innerHTML += row;
                });
            } catch (error) { console.error("Erreur:", error); }
        }
        chargerTransactionsAdmin();
        setInterval(chargerTransactionsAdmin, 10000); // Mise à jour toutes les 10s pour alléger
    </script>
</body>
                                                                                      </html>
