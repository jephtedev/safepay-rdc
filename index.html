<!DOCTYPE html>
<html lang="fr" class="bg-[#0B0E14] text-white">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafePay RDC | Console Officielle</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass-card { background: rgba(20, 24, 38, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.05); border-radius: 24px; }
        .phone-frame { transition: transform 0.3s ease; perspective: 1000px; }
        .phone-frame:hover { transform: translateY(-10px) rotateY(5deg); }
        iframe { width: 100%; height: 100%; border: none; border-radius: 20px; }
    </style>
</head>
<body class="p-6 md:p-10 font-sans min-h-screen">

    <header class="flex justify-between items-center mb-10 border-b border-white/10 pb-6">
        <div>
            <h1 class="text-3xl font-black tracking-tighter">SafePay RDC <span class="text-indigo-500">Global Simulator</span></h1>
            <p class="text-slate-400 text-sm">Projet : Cedrick Tshiyobo | Architecture : Jephté MANWANA</p>
        </div>
        <button onclick="window.location.reload()" class="px-6 py-2 bg-indigo-600 hover:bg-indigo-700 rounded-full text-xs font-bold transition">
            🔄 ACTUALISER LES ÉCRANS
        </button>
    </header>

    <section class="grid grid-cols-1 md:grid-cols-3 gap-8 mb-10">
        <div class="phone-frame h-[600px] glass-card p-2"><iframe src="client-accueil.html"></iframe></div>
        <div class="phone-frame h-[600px] glass-card p-2"><iframe src="vendeur.html"></iframe></div>
        <div class="phone-frame h-[600px] glass-card p-2"><iframe src="client-qr.html"></iframe></div>
    </section>

    <section class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <div class="lg:col-span-2 glass-card p-6 h-[500px]">
            <iframe src="admin.html"></iframe>
        </div>
        <div class="glass-card p-8 flex flex-col justify-center items-center text-center">
            <div class="w-24 h-24 bg-indigo-600 rounded-full flex items-center justify-center text-4xl font-black mb-6 shadow-xl shadow-indigo-500/20">JM</div>
            <h2 class="text-2xl font-bold">Jephté MANWANA</h2>
            <p class="text-indigo-400 font-semibold mb-6 uppercase tracking-widest text-sm">Administrateur Système Principal</p>
            <div class="w-full bg-white/5 p-5 rounded-2xl text-xs text-slate-400 border border-white/5">
                Écosystème certifié SafePay RDC <br>
                <span class="text-white font-bold">Direction Technique</span>
            </div>
        </div>
    </section>

</body>
            </html>
