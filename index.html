<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafePay RDC - Console de Démonstration Globale</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        safepayPurple: '#4F46E5',
                        safepayDark: '#1E1B4B',
                        adminDark: '#0F111A',
                        adminSidebar: '#161926'
                    }
                }
            }
        }
    </script>
    <style>
        iframe::-webkit-scrollbar { display: none; }
        iframe { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-[#0F111A] text-slate-100 font-sans min-h-screen flex flex-col overflow-x-hidden">

    <header class="bg-[#161926] border-b border-slate-800 px-8 py-4 flex flex-col md:flex-row justify-between items-center gap-4 shrink-0">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-xl shadow-lg shadow-indigo-500/20">🔒</div>
            <div>
                <h1 class="text-lg font-black tracking-wide text-white">SafePay RDC — Simulateur Global</h1>
                <p class="text-xs text-slate-400 font-medium">Projet initié par <span class="text-indigo-400 font-bold">Cedrick Tshiyobo</span></p>
            </div>
        </div>
        
        <div class="flex items-center gap-4 text-xs font-semibold">
            <span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-3 py-1.5 rounded-xl flex items-center gap-2">
                <span class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></span> Système en Ligne
            </span>
            <button onclick="rafraichirLesEcransSimules()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-1.5 rounded-xl transition-all shadow-md">
                🔄 Actualiser
            </button>
        </div>
    </header>

    <main class="flex-1 p-6 gap-6 grid grid-cols-1 xl:grid-cols-12 min-h-0">
        
        <div class="xl:col-span-7 flex flex-col md:flex-row justify-center items-center gap-6 bg-[#131622] rounded-3xl p-6 border border-slate-800/60">
            <div class="flex flex-col items-center">
                <span class="text-xs font-bold text-indigo-400 uppercase tracking-widest mb-3">📱 Interface Acheteur</span>
                <div class="w-[350px] h-[740px] bg-white rounded-[44px] shadow-2xl border-[10px] border-slate-800 flex flex-col relative overflow-hidden ring-4 ring-indigo-500/10">
                    <iframe id="iframe-client" src="client-accueil.html" class="w-full h-full border-0"></iframe>
                </div>
            </div>
            <div class="flex flex-col items-center">
                <span class="text-xs font-bold text-emerald-400 uppercase tracking-widest mb-3">🏪 Espace Vendeur</span>
                <div class="w-[350px] h-[740px] bg-slate-950 rounded-[44px] p-2.5 border-[10px] border-slate-800 shadow-2xl relative overflow-hidden ring-4 ring-emerald-500/10">
                    <iframe id="iframe-vendeur-integre" src="vendeur.html" class="w-full h-full rounded-[34px] border-0 bg-white"></iframe>
                </div>
            </div>
        </div>

        <div class="xl:col-span-5 flex flex-col bg-[#131622] rounded-3xl p-4 border border-slate-800/60 min-h-[500px]">
            <div class="flex items-center gap-4 p-4 border-b border-slate-800 mb-4">
                <div class="w-12 h-12 bg-purple-600 rounded-full flex items-center justify-center font-black text-white text-lg">JM</div>
                <div>
                    <h2 class="text-sm font-bold text-white">Jephté MANWANA</h2>
                    <p class="text-[10px] text-purple-400 font-semibold uppercase tracking-wider">Administrateur Système</p>
                    <p class="text-[9px] text-slate-500 mt-0.5">Projet pour : Cedrick Tshiyobo</p>
                </div>
            </div>
            
            <div class="flex-1 bg-slate-950 rounded-2xl border border-slate-800 overflow-hidden flex flex-col shadow-2xl">
                <div class="bg-slate-900 px-4 py-2 flex items-center gap-2 border-b border-slate-800 text-xs text-slate-500">
                    Panel de Contrôle Global
                </div>
                <iframe id="iframe-admin-integre" src="admin.html" class="flex-1 w-full border-0 bg-slate-50"></iframe>
            </div>
        </div>
    </main>

    <script>
        function rafraichirLesEcransSimules() {
            // Actualisation forcée de tous les cadres
            document.getElementById('iframe-client').contentWindow.location.reload();
            document.getElementById('iframe-vendeur-integre').contentWindow.location.reload();
            document.getElementById('iframe-admin-integre').contentWindow.location.reload();
        }
    </script>
</body>
        </html>
